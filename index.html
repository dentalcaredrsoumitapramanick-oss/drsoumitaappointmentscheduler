<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাপয়েন্টমেন্ট বুকিং | ডঃ সৌমিতা প্রামাণিক ডেন্টাল কেয়ার</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 md:p-8">

    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">ডঃ সৌমিতা প্রামাণিক ডেন্টাল কেয়ার</h1>
        
        <form id="safeBookingForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">রোগীর নাম *</label>
                <input type="text" id="fullName" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">ফোন নম্বর *</label>
                <input type="tel" id="phone" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">তারিখ *</label>
                    <input type="date" id="appointmentDate" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">সময় *</label>
                    <input type="time" id="timeSlot" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700">
                নিরাপদে বুক করুন
            </button>
        </form>
    </div>

    <script>
        document.getElementById('safeBookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                appointmentDate: document.getElementById('appointmentDate').value,
                timeSlot: document.getElementById('timeSlot').value
            };

            try {
                const response = await fetch('https://drsoumitaappointmentscheduler.vercel.app/api/book-appointment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                if (response.ok) {
                    alert('অ্যাপয়েন্টমেন্ট সফলভাবে গৃহীত হয়েছে!');
                    document.getElementById('safeBookingForm').reset();
                } else {
                    alert('ত্রুটি: ' + result.message);
                }
            } catch (error) {
                alert('সার্ভারে সংযোগ করতে সমস্যা হয়েছে।');
            }
        });
    </script>
</body>
</html>
